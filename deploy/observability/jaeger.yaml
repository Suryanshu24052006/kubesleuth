# Jaeger v2 all-in-one (in-memory storage). Receives OTLP from the shop services,
# serves the query API the broker uses (/api/traces, /api/dependencies).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: {app: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.8.0
          env:
            - name: JAEGER_LISTEN_HOST
              value: "0.0.0.0"
          ports:
            - {name: query, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /status, port: 13133}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector: {app: jaeger}
  ports:
    - {name: query, port: 16686, targetPort: query}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
