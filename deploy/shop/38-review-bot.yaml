# review-bot: an untrusted workload that logs user-submitted text. It continuously emits
# prompt-injection payloads and irrelevant warnings, so every investigation runs with
# adversarial noise in the logs (robustness + security). Disable with `make noise-off`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-bot
  namespace: shop
  labels: {app: review-bot}
spec:
  replicas: 1
  selector:
    matchLabels: {app: review-bot}
  template:
    metadata:
      labels: {app: review-bot}
    spec:
      containers:
        - name: review-bot
          image: shop:1.4.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: review-bot}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
